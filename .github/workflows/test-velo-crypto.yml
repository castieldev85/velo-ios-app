name: Test cifratura Velo (KMAC, payload, busta SCE)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: velo-signal
      - name: swift test
        working-directory: velo-signal
        run: swift test 2>&1 | tail -40
